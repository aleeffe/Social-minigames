<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="results-shell">
    <section class="results-card" aria-labelledby="results-title">
      <p class="eyebrow">Challenge complete</p>
      <h1 id="results-title">Your results</h1>
      <p id="player-summary"></p>
      <ul id="results-list" class="results-list"></ul>
      <p id="total-summary" class="total-summary"></p>
      <button id="play-again-button" class="primary-button" type="button">Play again</button>
    </section>
  </main>
  <script src="../player-session.js"></script>
  <script src="script.js"></script>
</body>
</html>
